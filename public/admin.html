<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administration - PhotosMariage</title>

    <link rel="stylesheet" href="admin.css">
</head>


<body>

    <div class="admin-container">

        <h1>💍 Créer un mariage</h1>

        <p>
            Remplis les informations du mariage pour créer un nouvel album.
        </p>


        <form id="mariageForm">


            <label>Prénoms des mariés</label>
            <input 
                type="text" 
                name="prenoms" 
                placeholder="Sarah & Julien" 
                required
            >


            <label>Identifiant du mariage</label>
            <input 
                type="text" 
                name="id" 
                placeholder="sarah-julien" 
                required
            >


            <label>Date du mariage</label>
            <input 
                type="date" 
                name="date" 
                required
            >


            <label>Heure de la cérémonie</label>
            <input 
                type="time" 
                name="heure"
            >


            <label>Mairie</label>
            <input 
                type="text" 
                name="mairie" 
                placeholder="Mairie de Saint-Paul"
            >


            <label>Lieu de réception</label>
            <input 
                type="text" 
                name="lieu" 
                placeholder="Domaine de Vin's"
            >


            <label>Couleur principale</label>
            <input 
                type="color" 
                name="couleur" 
                value="#1F3A5F"
            >


            <label>Message d'accueil</label>

            <textarea 
                name="message" 
                rows="5"
                placeholder="Bienvenue dans notre album..."
            ></textarea>



            <button type="submit">
                Créer le mariage 💍
            </button>


        </form>


    </div>



    <script src="admin.js"></script>


</body>

</html>
