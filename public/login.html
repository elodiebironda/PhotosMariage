<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administration - Connexion</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #F8F5F4;
            color: #1F3A5F;
        }


        .connexion {
            width: 90%;
            max-width: 400px;

            background: white;

            padding: 40px 25px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.08);
        }


        h1 {
            color: #C78C9A;

            margin-bottom: 10px;
        }


        p {
            line-height: 1.6;
        }


        label {
            display: block;

            text-align: left;

            margin-top: 20px;

            font-weight: bold;
        }


        input {
            width: 100%;

            box-sizing: border-box;

            padding: 15px;

            margin-top: 8px;

            border:
                1px solid #ddd;

            border-radius: 12px;

            font-size: 16px;
        }


        button {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 30px;

            background: #1F3A5F;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        button:hover {
            opacity: 0.9;
        }


        .inscription {
            display: inline-block;
            margin-top: 5px;

            color: #1F3A5F;

            text-decoration: none;

            font-weight: bold;
        }


        .inscription:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="connexion">

        <h1>🔐 Administration</h1>

        <p>
            Connecte-toi pour gérer les albums
            de mariage.
        </p>


        <form
            action="/login"
            method="POST"
        >

            <label>
                Nom utilisateur
            </label>

            <input
                type="text"
                name="username"
                placeholder="admin"
                required
            >


            <label>
                Mot de passe
            </label>

            <input
                type="password"
                name="password"
                placeholder="Votre mot de passe"
                required
            >


            <button type="submit">
                Se connecter 🔐
            </button>

        </form>


        <p>
            Vous n'avez pas encore de compte ?
        </p>

        <a
            class="inscription"
            href="/inscription"
        >
            Créer mon compte 💍
        </a>

    </div>

</body>

</html>
