<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Créer mon compte 💍</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #F8F5F4;
            color: #1F3A5F;
        }


        .inscription {
            width: 90%;
            max-width: 420px;

            background: white;

            padding: 40px 25px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.08);
        }


        h1 {
            color: #C78C9A;
            margin-bottom: 10px;
        }


        p {
            line-height: 1.6;
        }


        label {
            display: block;

            text-align: left;

            margin-top: 18px;

            font-weight: bold;
        }


        input {
            width: 100%;

            box-sizing: border-box;

            padding: 14px;

            margin-top: 8px;

            border: 1px solid #ddd;

            border-radius: 12px;

            font-size: 16px;
        }


        button {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 30px;

            background: #1F3A5F;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        button:hover {
            opacity: 0.9;
        }


        .retour {
            display: inline-block;

            margin-top: 20px;

            color: #1F3A5F;

            text-decoration: none;
        }

    </style>

</head>


<body>

    <div class="inscription">

        <h1>💍 Créer mon compte</h1>

        <p>
            Créez votre compte pour gérer
            votre album de mariage.
        </p>


        <form
            action="/inscription"
            method="POST"
        >


            <label>
                Votre nom
            </label>

            <input
                type="text"
                name="nom"
                placeholder="Élodie & Émilie"
                required
            >


            <label>
                Adresse e-mail
            </label>

            <input
                type="email"
                name="email"
                placeholder="votre@email.com"
                required
            >


            <label>
                Mot de passe
            </label>

            <input
                type="password"
                name="password"
                placeholder="Choisissez un mot de passe"
                minlength="8"
                required
            >


            <label>
                Confirmer le mot de passe
            </label>

            <input
                type="password"
                name="confirmation"
                placeholder="Retapez votre mot de passe"
                minlength="8"
                required
            >


            <button type="submit">
                Créer mon compte ❤️
            </button>

        </form>


        <a
            class="retour"
            href="/login"
        >
            Retour à la connexion
        </a>

    </div>

</body>

</html>
